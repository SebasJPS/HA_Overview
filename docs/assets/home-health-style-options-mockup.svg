<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" role="img" aria-labelledby="title desc">
  <title id="title">Home Health dashboard style options mockup</title>
  <desc id="desc">Mockup of the Home Assistant options dialog showing the dashboard look selector with Nothing Apple Clean and Neo Bauhaus Classic choices.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity=".14"/>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.1" fill="#111111" opacity=".12"/>
    </pattern>
    <pattern id="microdots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#111111" opacity=".3"/>
    </pattern>
  </defs>
  <rect width="1080" height="420" fill="#f7f7f5"/>
  <rect width="1080" height="420" fill="url(#dots)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Arial, sans-serif">
    <text x="48" y="60" font-size="34" font-weight="850" fill="#111111">Dashboard-Look im Setup waehlen</text>
    <text x="48" y="88" font-size="15" font-weight="650" fill="#6d6d72">Default ist Nothing / Apple Clean. Der bisherige Neo-Bauhaus-Look bleibt als zweite Option erhalten.</text>

    <g transform="translate(48 124)" filter="url(#shadow)">
      <rect width="450" height="236" rx="28" fill="#ffffff" stroke="#111111" stroke-opacity=".1"/>
      <text x="28" y="42" font-size="20" font-weight="850" fill="#111111">Home Health Overview Optionen</text>
      <text x="28" y="82" font-size="13" font-weight="760" fill="#6d6d72">Dashboard-Look</text>
      <rect x="28" y="98" width="394" height="48" rx="16" fill="#f8f8f8" stroke="#111111" stroke-opacity=".1"/>
      <text x="46" y="128" font-size="16" font-weight="760" fill="#111111">Nothing / Apple Clean</text>
      <path d="M394 116 L404 126 L414 116" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round"/>
      <text x="28" y="182" font-size="13" font-weight="760" fill="#6d6d72">Update-Erkennung</text>
      <rect x="28" y="198" width="186" height="28" rx="14" fill="#111111"/>
      <text x="44" y="217" font-size="12" font-weight="800" fill="#ffffff">Status on = Update</text>
    </g>

    <g transform="translate(544 124)">
      <g filter="url(#shadow)">
        <rect width="218" height="236" rx="28" fill="#ffffff" stroke="#111111" stroke-opacity=".1"/>
      </g>
      <rect x="24" y="24" width="46" height="46" rx="15" fill="#ffffff" stroke="#111111" stroke-opacity=".12"/>
      <rect x="33" y="33" width="28" height="28" fill="url(#microdots)"/>
      <circle cx="62" cy="62" r="5" fill="#ff3b30"/>
      <text x="24" y="112" font-size="44" font-weight="850" fill="#111111">94%</text>
      <text x="26" y="142" font-size="14" font-weight="760" fill="#6d6d72">Clean Default</text>
      <rect x="26" y="176" width="76" height="28" rx="14" fill="#111111"/>
      <text x="42" y="194" font-size="12" font-weight="800" fill="#ffffff">Modern</text>

      <g transform="translate(262 0)" filter="url(#shadow)">
        <rect width="218" height="236" rx="8" fill="#fffdf7" stroke="#111111" stroke-width="3"/>
      </g>
      <rect x="286" y="24" width="48" height="48" fill="#111111"/>
      <circle cx="304" cy="42" r="11" fill="#f6c431"/>
      <rect x="310" y="48" width="24" height="24" fill="#e53935"/>
      <text x="286" y="112" font-size="44" font-weight="900" fill="#111111">82%</text>
      <text x="288" y="142" font-size="14" font-weight="900" fill="#6d665c">Neo-Bauhaus</text>
      <rect x="288" y="176" width="76" height="28" rx="4" fill="#f6c431" stroke="#111111" stroke-width="2"/>
      <text x="303" y="194" font-size="12" font-weight="900" fill="#111111">Klassik</text>
    </g>
  </g>
</svg>
