<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc">
  <title id="title">Home Health Overview workflow mockup</title>
  <desc id="desc">A compact mockup showing how Home Health Overview turns Home Assistant entities into categories, a health score, and an actionable sidebar panel.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#111111" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#111111" flood-opacity="1"/>
    </filter>
  </defs>
  <rect width="1080" height="430" fill="#f7f4ed"/>
  <rect width="1080" height="430" fill="url(#grid)"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="46" y="58" font-size="34" font-weight="900" fill="#111111">Vom Status zum Handeln</text>
    <text x="46" y="84" font-size="15" font-weight="700" fill="#6d665c">Mockup der Datenlogik hinter dem Home-Health-Panel</text>

    <g transform="translate(46 124)" filter="url(#shadow)">
      <rect width="250" height="210" rx="6" fill="#fffdf7" stroke="#111111" stroke-width="3"/>
      <rect width="250" height="46" rx="6" fill="#111111"/>
      <text x="18" y="30" font-size="17" font-weight="900" fill="#ffffff">Quellen</text>
      <circle cx="204" cy="23" r="13" fill="#f6c431"/>
      <text x="18" y="78" font-size="15" font-weight="900" fill="#111111">Home Assistant Entities</text>
      <text x="18" y="106" font-size="13" font-weight="700" fill="#6d665c">Sensoren, Binary Sensoren,</text>
      <text x="18" y="126" font-size="13" font-weight="700" fill="#6d665c">MQTT, Zigbee2MQTT,</text>
      <text x="18" y="146" font-size="13" font-weight="700" fill="#6d665c">Supervisor und Systemdaten</text>
      <rect x="18" y="168" width="92" height="24" rx="4" fill="#1565c0"/>
      <text x="32" y="185" font-size="11" font-weight="900" fill="#ffffff">ERKENNEN</text>
    </g>

    <path d="M 326 230 H 386" stroke="#111111" stroke-width="5"/>
    <path d="M 386 230 L 370 218 M 386 230 L 370 242" stroke="#111111" stroke-width="5" fill="none"/>

    <g transform="translate(416 124)" filter="url(#shadow)">
      <rect width="250" height="210" rx="6" fill="#fffdf7" stroke="#111111" stroke-width="3"/>
      <rect width="250" height="46" rx="6" fill="#111111"/>
      <text x="18" y="30" font-size="17" font-weight="900" fill="#ffffff">Bewertung</text>
      <rect x="194" y="10" width="28" height="28" fill="#e53935"/>
      <text x="18" y="78" font-size="15" font-weight="900" fill="#111111">Gewichteter Health Score</text>
      <text x="18" y="106" font-size="13" font-weight="700" fill="#6d665c">Verfuegbarkeit, Aktualitaet,</text>
      <text x="18" y="126" font-size="13" font-weight="700" fill="#6d665c">Batterien, Temperatur, APIs,</text>
      <text x="18" y="146" font-size="13" font-weight="700" fill="#6d665c">Zigbee und Ressourcen</text>
      <rect x="18" y="168" width="166" height="14" fill="#ffffff" stroke="#111111" stroke-width="2"/>
      <rect x="20" y="170" width="136" height="10" fill="#f6c431"/>
      <text x="194" y="182" font-size="22" font-weight="900" fill="#111111">82%</text>
    </g>

    <path d="M 696 230 H 756" stroke="#111111" stroke-width="5"/>
    <path d="M 756 230 L 740 218 M 756 230 L 740 242" stroke="#111111" stroke-width="5" fill="none"/>

    <g transform="translate(786 124)" filter="url(#shadow)">
      <rect width="250" height="210" rx="6" fill="#fffdf7" stroke="#111111" stroke-width="3"/>
      <rect width="250" height="46" rx="6" fill="#111111"/>
      <text x="18" y="30" font-size="17" font-weight="900" fill="#ffffff">Aktionen</text>
      <rect x="192" y="0" width="58" height="46" fill="#1565c0"/>
      <text x="18" y="78" font-size="15" font-weight="900" fill="#111111">Panel mit konkreten Listen</text>
      <text x="18" y="106" font-size="13" font-weight="700" fill="#6d665c">Suchen, filtern, Detailansicht</text>
      <text x="18" y="126" font-size="13" font-weight="700" fill="#6d665c">oeffnen und direkt entscheiden:</text>
      <rect x="18" y="150" width="88" height="30" rx="4" fill="#ffffff" stroke="#111111" stroke-width="2"/>
      <text x="31" y="170" font-size="11" font-weight="900" fill="#111111">IGNORIEREN</text>
      <rect x="116" y="150" width="104" height="30" rx="4" fill="#f6c431" stroke="#111111" stroke-width="2"/>
      <text x="130" y="170" font-size="11" font-weight="900" fill="#111111">UEBERWACHEN</text>
    </g>

    <rect x="46" y="374" width="990" height="2" fill="#111111"/>
    <text x="46" y="402" font-size="13" font-weight="800" fill="#6d665c">Ziel: Nicht nur Status anzeigen, sondern schneller entscheiden, welche Entitaeten wichtig sind.</text>
  </g>
</svg>
