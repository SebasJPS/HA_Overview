<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc">
  <title id="title">Home Health Overview workflow mockup</title>
  <desc id="desc">A compact workflow graphic in the same visual style as the real Home Health dashboard.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.1" fill="#111111" opacity=".11"/>
    </pattern>
    <pattern id="microDots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#111111" opacity=".28"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf7f4"/>
      <stop offset=".55" stop-color="#f6eeee"/>
      <stop offset="1" stop-color="#eee4df"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#2a1814" flood-opacity=".08"/>
    </filter>
  </defs>
  <rect width="1080" height="430" fill="url(#bg)"/>
  <rect width="1080" height="430" fill="url(#dots)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Arial, sans-serif">
    <text x="42" y="58" font-size="34" font-weight="850" fill="#111111">Vom Status zum Handeln</text>
    <text x="42" y="86" font-size="15" font-weight="750" fill="#777174">Die gleiche Logik hinter dem echten Home-Health-Dashboard.</text>

    <g transform="translate(42 126)">
      <g filter="url(#shadow)">
        <rect width="280" height="218" rx="28" fill="#ffffff" fill-opacity=".88" stroke="#111111" stroke-opacity=".06"/>
      </g>
      <rect x="24" y="24" width="48" height="18" fill="url(#microDots)"/>
      <text x="24" y="76" font-size="20" font-weight="900" fill="#111111">Quellen finden</text>
      <text x="24" y="110" font-size="14" font-weight="700" fill="#777174">Home Assistant Entities, MQTT,</text>
      <text x="24" y="132" font-size="14" font-weight="700" fill="#777174">Zigbee2MQTT, Supervisor,</text>
      <text x="24" y="154" font-size="14" font-weight="700" fill="#777174">Updates und Systemdaten.</text>
      <text x="24" y="198" font-size="42" font-weight="900" fill="#111111">1447</text>
      <text x="126" y="198" font-size="14" font-weight="850" fill="#777174">Entitaeten</text>
    </g>

    <path d="M344 236H394" stroke="#111111" stroke-opacity=".42" stroke-width="5" stroke-linecap="round"/>
    <path d="M394 236l-14-11m14 11-14 11" stroke="#111111" stroke-opacity=".42" stroke-width="5" stroke-linecap="round" fill="none"/>

    <g transform="translate(418 126)">
      <g filter="url(#shadow)">
        <rect width="280" height="218" rx="28" fill="#ffffff" fill-opacity=".88" stroke="#111111" stroke-opacity=".06"/>
      </g>
      <rect x="24" y="24" width="48" height="18" fill="url(#microDots)"/>
      <text x="24" y="76" font-size="20" font-weight="900" fill="#111111">Score berechnen</text>
      <text x="24" y="110" font-size="14" font-weight="700" fill="#777174">Gewichtete Komponenten fuer</text>
      <text x="24" y="132" font-size="14" font-weight="700" fill="#777174">Verfuegbarkeit, Geraete,</text>
      <text x="24" y="154" font-size="14" font-weight="700" fill="#777174">Add-ons und Ressourcen.</text>
      <text x="24" y="198" font-size="54" font-weight="900" fill="#111111">91%</text>
      <rect x="154" y="178" width="96" height="8" rx="4" fill="#ededed"/>
      <rect x="154" y="178" width="87" height="8" rx="4" fill="#32d436"/>
    </g>

    <path d="M720 236H770" stroke="#111111" stroke-opacity=".42" stroke-width="5" stroke-linecap="round"/>
    <path d="M770 236l-14-11m14 11-14 11" stroke="#111111" stroke-opacity=".42" stroke-width="5" stroke-linecap="round" fill="none"/>

    <g transform="translate(794 126)">
      <g filter="url(#shadow)">
        <rect width="244" height="218" rx="28" fill="#ffffff" fill-opacity=".88" stroke="#111111" stroke-opacity=".06"/>
      </g>
      <rect x="24" y="24" width="48" height="18" fill="url(#microDots)"/>
      <text x="24" y="76" font-size="20" font-weight="900" fill="#111111">Entscheiden</text>
      <text x="24" y="110" font-size="14" font-weight="700" fill="#777174">Problemgruppen oeffnen,</text>
      <text x="24" y="132" font-size="14" font-weight="700" fill="#777174">Details pruefen und Geraete</text>
      <text x="24" y="154" font-size="14" font-weight="700" fill="#777174">direkt ignorieren.</text>
      <rect x="24" y="174" width="138" height="34" rx="17" fill="#111111"/>
      <text x="40" y="196" font-size="12" font-weight="850" fill="#ffffff">Geraet ignorieren</text>
    </g>

    <rect x="42" y="382" width="996" height="1" fill="#111111" opacity=".12"/>
    <text x="42" y="408" font-size="13" font-weight="800" fill="#777174">Ziel: nicht nur Status anzeigen, sondern schnell erkennen, welche Bereiche echte Aufmerksamkeit brauchen.</text>
  </g>
</svg>
