        <text x="12" y="256" font-weight="900">Kinderzimmer Heizung</text><text x="12" y="278" font-size="13" fill="#777174">16 Entitaeten</text><text x="500" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="900">unavailable</text><text x="680" y="256">Kinderzimmer</text><text x="950" y="256">Kinderzimmer Heizung</text><text x="1250" y="256" fill="#777174">16 von 16</text><rect x="1340" y="236" width="122" height="34" rx="17" fill="#111111"/><text x="1354" y="258" font-size="12" font-weight="850" fill="#ffffff">Geraet ignorieren</text>
        <text x="12" y="318" font-weight="900">Schlafzimmer Heizung kleine</text><text x="12" y="340" font-size="13" fill="#777174">16 Entitaeten</text><text x="500" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="900">unavailable</text><text x="680" y="318">Schlafzimmer</text><text x="950" y="318">Schlafzimmer Heizung kleine</text><text x="1250" y="318" fill="#777174">16 von 16</text><rect x="1340" y="298" width="122" height="34" rx="17" fill="#111111"/><text x="1354" y="320" font-size="12" font-weight="850" fill="#ffffff">Geraet ignorieren</text>
