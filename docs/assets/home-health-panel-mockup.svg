<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1700" viewBox="0 0 1536 1700" role="img" aria-labelledby="title desc">
  <title id="title">Home Health Overview dashboard screenshot style</title>
  <desc id="desc">A documentation image matching the real Home Health dashboard with a large score card, KPI tiles, score components, source cards, and an issue table.</desc>
  <defs>
    <pattern id="pageDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.15" fill="#111111" opacity=".11"/>
    </pattern>
    <pattern id="microDots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" fill="#111111" opacity=".28"/>
    </pattern>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf7f4"/>
      <stop offset=".54" stop-color="#f5eeee"/>
      <stop offset="1" stop-color="#eee4df"/>
    </linearGradient>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#2a1814" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="1536" height="1700" fill="url(#pageBg)"/>
  <rect width="1536" height="1700" fill="url(#pageDots)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Arial, sans-serif">
    <g transform="translate(24 20)">
      <rect x="4" y="4" width="74" height="54" rx="16" fill="#ffffff" stroke="#111111" stroke-opacity=".12"/>
      <path d="M18 34 41 15 64 34v19H18z" fill="#2f7fa4"/>
      <path d="M14 34 39 13a4 4 0 0 1 5 0l25 21" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="31" y="35" width="22" height="18" rx="4" fill="#ffffff"/>
      <path d="M34 44h5l4-8 6 15 4-7h5" fill="none" stroke="#ff3b30" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="92" y="20" font-size="13" font-weight="850" letter-spacing=".3" fill="#777174">HOME ASSISTANT KONTROLLZENTRUM</text>
      <text x="92" y="72" font-size="58" font-weight="850" fill="#111111">Home Health</text>
      <rect x="1292" y="24" width="196" height="44" rx="22" fill="#ffffff" stroke="#111111" stroke-opacity=".1"/>
      <text x="1310" y="52" font-size="16" font-weight="850" fill="#111111">Pruefen · 163 Hinweise</text>
    </g>

    <g transform="translate(24 108)">
      <g filter="url(#cardShadow)">
        <rect width="442" height="486" rx="30" fill="#ffffff" fill-opacity=".88" stroke="#111111" stroke-opacity=".06"/>
      </g>
      <text x="30" y="116" font-size="104" font-weight="900" fill="#090909">91%</text>
      <text x="30" y="148" font-size="17" font-weight="800" fill="#777174">Systemzustand</text>
      <rect x="324" y="30" width="88" height="88" fill="url(#microDots)" opacity=".24"/>
      <g transform="translate(350 394) rotate(-90)">
        <circle cx="0" cy="0" r="54" fill="none" stroke="#dcefdc" stroke-width="14"/>
        <circle cx="0" cy="0" r="54" fill="none" stroke="#3fa348" stroke-width="14" stroke-dasharray="309 340" stroke-linecap="butt"/>
      </g>
      <g font-size="13" font-weight="800" fill="#2d2d31">
        <rect x="30" y="344" width="153" height="32" rx="16" fill="#ffffff" stroke="#111111" stroke-opacity=".09"/>
        <text x="42" y="365">Explizit ueberwacht: 0</text>
        <rect x="30" y="384" width="110" height="32" rx="16" fill="#ffffff" stroke="#111111" stroke-opacity=".09"/>
        <text x="42" y="405">Ignoriert: 38</text>
        <rect x="30" y="424" width="146" height="32" rx="16" fill="#ffffff" stroke="#111111" stroke-opacity=".09"/>
        <text x="42" y="445">Ignorierte Geraete: 3</text>
