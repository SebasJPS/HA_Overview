<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Home Health Overview Nothing Apple panel mockup</title>
  <desc id="desc">A clean Home Assistant dashboard mockup with a large health score, glass-like cards, dot matrix details, search, filters, and actionable issue lists.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#111111" opacity=".12"/>
    </pattern>
    <pattern id="microdots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#111111" opacity=".28"/>
