        <rect x="20" y="20" width="46" height="18" fill="url(#microDots)"/>
      </g>
      <use href="#tile" x="0" y="0"/><text x="20" y="98" font-size="42" font-weight="900" fill="#080808">105</text><text x="20" y="126">Offline / unbekannt</text>
      <use href="#tile" x="210" y="0"/><text x="230" y="98" font-size="42" font-weight="900" fill="#080808">0</text><text x="230" y="126">Keine Updates</text>
      <use href="#tile" x="420" y="0"/><text x="440" y="98" font-size="42" font-weight="900" fill="#080808">0</text><text x="440" y="126">Batterien niedrig</text>
      <use href="#tile" x="630" y="0"/><text x="650" y="98" font-size="42" font-weight="900" fill="#080808">0</text><text x="650" y="126">Batterien kritisch</text>
      <use href="#tile" x="840" y="0"/><text x="860" y="98" font-size="42" font-weight="900" fill="#080808">0</text><text x="860" y="126">Temp. Ausreisser</text>
      <use href="#tile" x="0" y="168"/><text x="20" y="266" font-size="42" font-weight="900" fill="#080808">0</text><text x="20" y="294">APIs offline</text>
      <use href="#tile" x="210" y="168"/><text x="230" y="266" font-size="42" font-weight="900" fill="#080808">0</text><text x="230" y="294">Zigbee Signal schwach</text>
      <use href="#tile" x="420" y="168"/><text x="440" y="266" font-size="42" font-weight="900" fill="#080808">2</text><text x="440" y="294">Add-on Probleme</text>
      <use href="#tile" x="630" y="168"/><text x="650" y="266" font-size="42" font-weight="900" fill="#080808">0</text><text x="650" y="294">Systemlast hoch</text>
      <use href="#tile" x="840" y="168"/><text x="860" y="266" font-size="42" font-weight="900" fill="#080808">0</text><text x="860" y="294">Updates verfuegbar</text>
      <use href="#tile" x="0" y="336"/><text x="20" y="434" font-size="42" font-weight="900" fill="#080808">57</text><text x="20" y="462">Geraete mit Problemen</text>
      <use href="#tile" x="210" y="336"/><text x="230" y="434" font-size="42" font-weight="900" fill="#080808">25°C</text><text x="230" y="462">Temperatur Median</text>
      <use href="#tile" x="420" y="336"/><text x="440" y="434" font-size="42" font-weight="900" fill="#080808">25.2°C</text><text x="440" y="462">Temperatur Mittelwert</text>
    </g>

