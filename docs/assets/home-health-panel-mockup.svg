        <use href="#source" x="0"/><text x="14" y="30">MQTT-Entitaeten</text><text x="14" y="112" font-size="42" font-weight="900" fill="#111111">6</text>
        <use href="#source" x="248"/><text x="262" y="30">Zigbee2MQTT-Entitaeten</text><text x="262" y="112" font-size="42" font-weight="900" fill="#111111">6</text>
        <use href="#source" x="496"/><text x="510" y="30">Zigbee Linkquality-Sensoren</text><text x="510" y="112" font-size="42" font-weight="900" fill="#111111">0</text>
        <use href="#source" x="744"/><text x="758" y="30">Bridge-Status-Entitaeten</text><text x="758" y="112" font-size="42" font-weight="900" fill="#111111">5</text>
        <use href="#source" x="992"/><text x="1006" y="30">Add-on Watchlist</text><text x="1006" y="112" font-size="42" font-weight="900" fill="#111111">5</text>
        <use href="#source" x="1240"/><text x="1254" y="30">Supervisor/Add-on Hinweise</text><text x="1254" y="112" font-size="42" font-weight="900" fill="#111111">2</text>
        <use href="#source" x="0" y="142"/><text x="14" y="172">Systemressourcen</text><text x="14" y="254" font-size="42" font-weight="900" fill="#111111">7</text>
        <use href="#source" x="248" y="142"/><text x="262" y="172">Update-Entitaeten</text><text x="262" y="254" font-size="42" font-weight="900" fill="#111111">101</text>
        <use href="#source" x="496" y="142"/><text x="510" y="172">Explizit ueberwacht</text><text x="510" y="254" font-size="42" font-weight="900" fill="#111111">0</text>
        <use href="#source" x="744" y="142"/><text x="758" y="172">Ignorierte Entitaeten</text><text x="758" y="254" font-size="42" font-weight="900" fill="#111111">38</text>
        <use href="#source" x="992" y="142"/><text x="1006" y="172">Ignorierte Geraete</text><text x="1006" y="254" font-size="42" font-weight="900" fill="#111111">3</text>
        <use href="#source" x="1240" y="142"/><text x="1254" y="172">Ignorierte Prefixe</text><text x="1254" y="254" font-size="42" font-weight="900" fill="#111111">0</text>
      </g>
    </g>

