        <use href="#component" x="0"/><text x="14" y="26" font-size="16" font-weight="900" fill="#111111">Verfuegbarkeit: <tspan font-weight="700">92.7%</tspan></text><text x="14" y="48">Betroffen: 105 von 1447 · Gewicht: 15</text><rect x="14" y="76" width="194" height="8" rx="4" fill="#32d436"/>
        <use href="#component" x="248"/><text x="262" y="26" font-size="16" font-weight="900" fill="#111111">Aktualitaet: <tspan font-weight="700">100%</tspan></text><text x="262" y="48">Betroffen: 0 von 1447 · Gewicht: 20</text><rect x="262" y="76" width="210" height="8" rx="4" fill="#32d436"/>
        <use href="#component" x="496"/><text x="510" y="26" font-size="16" font-weight="900" fill="#111111">Batterie: <tspan font-weight="700">100%</tspan></text><text x="510" y="48">Betroffen: 0 von 34 · Gewicht: 20</text><rect x="510" y="76" width="210" height="8" rx="4" fill="#32d436"/>
        <use href="#component" x="744"/><text x="758" y="26" font-size="16" font-weight="900" fill="#111111">Temperatur: <tspan font-weight="700">100%</tspan></text><text x="758" y="48">Betroffen: 0 von 23 · Gewicht: 15</text><rect x="758" y="76" width="210" height="8" rx="4" fill="#32d436"/>
        <use href="#component" x="992"/><text x="1006" y="26" font-size="16" font-weight="900" fill="#111111">Add-ons / Bridges: <tspan font-weight="700">60%</tspan></text><text x="1006" y="48">Betroffen: 2 von 5 · Gewicht: 10</text><rect x="1006" y="76" width="126" height="8" rx="4" fill="#b8dc24"/>
        <use href="#component" x="1240"/><text x="1254" y="26" font-size="16" font-weight="900" fill="#111111">Systemressourcen: <tspan font-weight="700">100%</tspan></text><text x="1254" y="48">Betroffen: 0 von 7 · Gewicht: 15</text><rect x="1254" y="76" width="210" height="8" rx="4" fill="#32d436"/>
        <use href="#component" x="0" y="110"/><text x="14" y="136" font-size="16" font-weight="900" fill="#111111">Updates: <tspan font-weight="700">100%</tspan></text><text x="14" y="158">Betroffen: 0 von 101 · Gewicht: 5</text><rect x="14" y="186" width="210" height="8" rx="4" fill="#32d436"/>
        <use href="#component" x="248" y="110"/><text x="262" y="136" font-size="16" font-weight="900" fill="#111111">Geraete: <tspan font-weight="700">66.1%</tspan></text><text x="262" y="158">Betroffen: 57 von 168 · Gewicht: 15</text><rect x="262" y="186" width="137" height="8" rx="4" fill="#a8dc24"/>
      </g>
