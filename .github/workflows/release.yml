name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate version and files
        id: version
        run: |
          python -m compileall -q custom_components/home_health_overview
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          ref_name = os.environ["GITHUB_REF_NAME"]
          manifest = json.loads(Path("custom_components/home_health_overview/manifest.json").read_text())
          actual = manifest["version"]
          if ref_name.startswith("v") and actual != ref_name[1:]:
              raise SystemExit(f"manifest version {actual} does not match tag {ref_name}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={actual}\n")
              output.write(f"tag=v{actual}\n")

          for path in [
              "hacs.json",
              "custom_components/home_health_overview/translations/de.json",
              "custom_components/home_health_overview/translations/en.json",
          ]:
              json.loads(Path(path).read_text())
              print(f"OK {path}")
          PY
          node --check custom_components/home_health_overview/frontend/panel.js

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

      - name: Build release notes
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"

          {
            echo "# Home Health Overview ${TAG}"
            echo
            echo "## Installation"
            echo
            echo "In HACS: \`Redownload / Neu herunterladen\` -> \`${TAG}\`, danach Home Assistant neu starten und den Browser hart neu laden."
            echo
            echo "## Changes"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              git log --pretty=format:"- %s (%h)" "${PREVIOUS_TAG}..${TAG}"
            else
              git log --pretty=format:"- %s (%h)" "${TAG}"
            fi
            echo
          } > RELEASE_NOTES.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          fail_on_unmatched_files: true
