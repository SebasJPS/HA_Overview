name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create version tag when missing
        id: version
        run: |
          VERSION="$(python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("custom_components/home_health_overview/manifest.json").read_text())
          print(manifest["version"])
          PY
          )"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "${TAG} already exists."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Home Health Overview ${VERSION}"
          git push origin "${TAG}"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        if: steps.version.outputs.created == 'true'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"

          {
            echo "# Home Health Overview ${TAG}"
            echo
            echo "## Installation"
            echo
            echo "In HACS: \`Redownload / Neu herunterladen\` -> \`${TAG}\`, danach Home Assistant neu starten und den Browser hart neu laden."
            echo
            echo "## Changes"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              git log --pretty=format:"- %s (%h)" "${PREVIOUS_TAG}..HEAD"
            else
              git log --pretty=format:"- %s (%h)" HEAD
            fi
            echo
          } > RELEASE_NOTES.md

      - name: Create GitHub release
        if: steps.version.outputs.created == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          make_latest: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release version
        id: version
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          ref_name = os.environ["GITHUB_REF_NAME"]
          manifest = json.loads(Path("custom_components/home_health_overview/manifest.json").read_text())
          actual = manifest["version"]
          if not ref_name.startswith("v"):
              raise SystemExit(f"release workflow must run from a version tag, got {ref_name}")
          if actual != ref_name[1:]:
              raise SystemExit(f"manifest version {actual} does not match tag {ref_name}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={actual}\n")
          PY

      - name: Build release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"

          {
            echo "# Home Health Overview ${TAG}"
            echo
            echo "## Installation"
            echo
            echo "In HACS: \`Redownload / Neu herunterladen\` -> \`${TAG}\`, danach Home Assistant neu starten und den Browser hart neu laden."
            echo
            echo "## Changes"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              git log --pretty=format:"- %s (%h)" "${PREVIOUS_TAG}..${TAG}"
            else
              git log --pretty=format:"- %s (%h)" "${TAG}"
            fi
            echo
          } > RELEASE_NOTES.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          make_latest: true
