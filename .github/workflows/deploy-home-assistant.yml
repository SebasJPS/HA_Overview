name: Deploy Home Health to Home Assistant

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HA_SSH_KEY }}" > ~/.ssh/ha_deploy_key
          chmod 600 ~/.ssh/ha_deploy_key
          ssh-keyscan -p "${{ secrets.HA_SSH_PORT }}" "${{ secrets.HA_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy files
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.HA_SSH_PORT }} -i ~/.ssh/ha_deploy_key" \
            packages/ \
            "${{ secrets.HA_SSH_USER }}@${{ secrets.HA_SSH_HOST }}:${{ secrets.HA_CONFIG_PATH }}/packages/"

          rsync -az --delete \
            -e "ssh -p ${{ secrets.HA_SSH_PORT }} -i ~/.ssh/ha_deploy_key" \
            dashboards/ \
            "${{ secrets.HA_SSH_USER }}@${{ secrets.HA_SSH_HOST }}:${{ secrets.HA_CONFIG_PATH }}/dashboards/"

      - name: Check Home Assistant configuration
        run: |
          ssh -p "${{ secrets.HA_SSH_PORT }}" \
            -i ~/.ssh/ha_deploy_key \
            "${{ secrets.HA_SSH_USER }}@${{ secrets.HA_SSH_HOST }}" \
            "ha core check"

      - name: Restart Home Assistant
        run: |
          ssh -p "${{ secrets.HA_SSH_PORT }}" \
            -i ~/.ssh/ha_deploy_key \
            "${{ secrets.HA_SSH_USER }}@${{ secrets.HA_SSH_HOST }}" \
            "ha core restart"
