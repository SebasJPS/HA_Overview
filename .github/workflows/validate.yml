name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate local files
        run: |
          python -m compileall -q custom_components/home_health_overview
          python - <<'PY'
          import json
          from pathlib import Path

          for path in [
              "hacs.json",
              "custom_components/home_health_overview/manifest.json",
              "custom_components/home_health_overview/translations/de.json",
              "custom_components/home_health_overview/translations/en.json",
          ]:
              json.loads(Path(path).read_text())
              print(f"OK {path}")
          PY
          node --check custom_components/home_health_overview/frontend/panel.js

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
